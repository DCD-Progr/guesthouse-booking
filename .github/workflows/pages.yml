name: Deploy GitHub Pages
on:
  workflow_dispatch:
    inputs:
      sample_only:
        description: Publish sample workspace without live database configuration
        type: boolean
        default: true
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build sample workspace
        if: ${{ inputs.sample_only }}
        run: npm run build
      - name: Build live workspace
        if: ${{ !inputs.sample_only }}
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Require live configuration when publishing live
        if: ${{ !inputs.sample_only }}
        env:
          PROJECT_URL: ${{ vars.VITE_SUPABASE_URL }}
          PUBLIC_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: test -n "$PROJECT_URL" && test -n "$PUBLIC_KEY"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
